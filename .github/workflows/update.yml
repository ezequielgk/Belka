name: Actualizar Índice de Paquetes

on:
  schedule:
    - cron: '0 3 * * 0' # Todos los domingos a las 03:00 AM UTC
  workflow_dispatch:    # Permite ejecución manual desde la pestaña Actions
    inputs:
      apps_to_index:
        description: 'Apps a actualizar (separadas por espacio, ej: "moss jq"). Deja en "ALL" para todas.'
        required: false
        default: 'ALL'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4


      - name: Auto-importar nuevos paquetes
        run: |
          if [ -s meta/next.list ]; then
            python3 scripts/add-app.py
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ejecutar script indexador
        run: |
          APPS="${{ github.event.inputs.apps_to_index }}"
          if [ -z "$APPS" ]; then
            APPS="ALL"
          fi
          ./scripts/build-repo.sh $APPS
        env:
          # Para evitar Rate Limits si se consulta mucho la API sin autenticación
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit y push de los cambios en packages.tsv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages.tsv meta/apps.list meta/next.list
          
          # Verifica silenciosamente si hubo algún cambio real en el archivo
          if ! git diff --staged --quiet; then
            git commit -m "chore: actualizar índice de paquetes automático 🤖"
            git pull --rebase origin main
            git push
          else
            echo "No hubo cambios en las versiones. Saltando commit."
          fi
